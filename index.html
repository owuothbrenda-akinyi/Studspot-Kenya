    <script>
      // Gracefully prevent unhandled Vite HMR client socket errors in iframe environment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf("reading 'send'") !== -1 || e.message.indexOf('WebSocket') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = (e && e.reason) ? String(e.reason) : '';
        if (reasonStr.indexOf("reading 'send'") !== -1 || reasonStr.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
