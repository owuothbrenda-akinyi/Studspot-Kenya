<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D59" />
      <stop offset="50%" stop-color="#08182F" />
      <stop offset="100%" stop-color="#050E1C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F3B71B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.35" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.25" stroke-dasharray="16 12" />
  
  <!-- Graduation Cap & Pin Pinpoint (STUDSPOT Emblem) -->
  <g transform="translate(256, 210)">
    <!-- Map Location Pin Outline -->
    <path d="M 0 -100 C -60 -100 -100 -50 -100 10 C -100 70 0 140 0 140 C 0 140 100 70 100 10 C 100 -50 60 -100 0 -100 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Central Marketplace S / Diamond symbol -->
    <path d="M -45 -15 L 0 -55 L 45 -15 L 0 25 Z" fill="url(#goldGrad)" />
    <!-- Graduation Mortarboard Top -->
    <polygon points="0,-48 -70,-22 0,4 70,-22" fill="#FFFFFF" opacity="0.95" />
    <!-- Cap base -->
    <path d="M -40 -12 L -40 18 Q 0 34 40 18 L 40 -12" fill="#0284C7" />
    <!-- Tassel -->
    <path d="M 50 -20 Q 75 0 75 35" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="75" cy="38" r="6" fill="#F3B71B" />
  </g>
  
  <!-- Text Label STUDSPOT -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">STUDSPOT</text>
  <text x="256" y="455" font-family="'Outfit', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F3B71B" text-anchor="middle" letter-spacing="6">CAMPUS APP · KENYA</text>
</svg>
