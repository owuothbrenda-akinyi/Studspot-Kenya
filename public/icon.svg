<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104" />
    </clipPath>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  
  <!-- Base background squircle -->
  <rect width="512" height="512" rx="104" fill="#121212" />
  
  <!-- Embedded High-Resolution Official Gold & Black STUDSPOT Icon -->
  <image href="/studspot-gold-icon.png" width="512" height="512" clip-path="url(#squircleClip)" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Subtle Chamfered Gold Border Overlay -->
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="url(#goldBorderGrad)" stroke-width="12" stroke-opacity="0.85" />
</svg>
